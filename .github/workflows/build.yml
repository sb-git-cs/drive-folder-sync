name: Build

on:
  push:
    branches: [main, 'release-*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Self-test
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process dist\DriveFolderSyncSetup.exe -ArgumentList '/selftest', $result -Wait -PassThru
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: DriveFolderSyncSetup
          path: dist/DriveFolderSyncSetup.exe

      # A push to main publishes Store.Version if it has no release yet.
      # The notes come from that version's section of CHANGELOG.md.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content src\Store.cs -Raw), 'Version = "([^"]+)"').Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "$tag is already released"; exit 0 }
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::IndexOf($lines, "## $version")
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $notes = foreach ($line in $lines[($start + 1)..($lines.Length - 1)]) { if ($line.StartsWith('## ')) { break }; $line }
          ($notes -join "`n").Trim() | Out-File -Encoding utf8 notes.md
          gh release create $tag dist\DriveFolderSyncSetup.exe --target $env:GITHUB_SHA --title "Drive Folder Sync $version" --notes-file notes.md
